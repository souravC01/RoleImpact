name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test backend
        run: ./mvnw --batch-mode test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build

  deploy-backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: roleimpact
      REGION: us-west1
      SERVICE: roleimpact-api
      AR_REPO: cloud-run-source-deploy
      IMAGE_NAME: roleimpact-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: roleimpact
          workload_identity_provider: projects/772739041868/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: roleimpact-github-deployer@roleimpact.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: roleimpact

      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build backend image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build \
            --file backend/Dockerfile \
            --tag "$IMAGE" \
            backend
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push backend image
        run: |
          docker push "$IMAGE"

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run services update "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --quiet

      - name: Verify deployed backend
        run: |
          SERVICE_URL="$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)')"

          echo "Checking ${SERVICE_URL}/api/v1/health"

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error \
              "${SERVICE_URL}/api/v1/health"; then
              echo
              echo "Backend health check passed."
              exit 0
            fi

            echo "Health check attempt ${attempt} failed. Retrying..."
            sleep 5
          done

          echo "Backend health check failed."
          exit 1
