services:
  postgres:
    image: postgres:17-alpine
    container_name: roleimpact-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roleimpact}
      POSTGRES_USER: ${POSTGRES_USER:-roleimpact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roleimpact}
    ports:
      - "5432:5432"
    volumes:
      - roleimpact_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roleimpact_postgres_data:
